<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino 5K - IYFY Academy</title>
<style>
    /* RESET E BASE IGUAIS À HOME */
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ font-family:Arial, sans-serif; background:#000; color:#fff; }
    a{ text-decoration:none; color:inherit; }

    /* =========================
   HEADER
========================= */

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;

    background:#050505;
    border-bottom:1px solid #222;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 8%;

    z-index:1000;
}


/* LOGO */

.logo{
    font-size:1.8rem;
    font-weight:900;
    white-space:nowrap;
}


/* MENU */

.menu{
    display:flex;
    align-items:center;
    gap:25px;

    list-style:none;
}


/* LINK DO MENU */

.menu a{
    color:#aaa;
    font-size:1rem;

    text-decoration:none;

    transition:0.3s;
}

.menu a:hover{
    color:#fff;
}

    /* CONTAINER PRINCIPAL */
    .container{ padding:120px 8% 40px; max-width:1400px; margin:0 auto; }
    .page-title{ margin-bottom:30px; font-size:2rem; }

    /* CARDS DE DESTAQUE */
    .grid-top { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px; margin-bottom:40px; }
    .card{ background:#111; border:1px solid #222; border-radius:12px; padding:25px; }
    .card.highlight { border-color: #555; }
    .badge { font-size:12px; color:#aaa; margin-bottom:10px; text-transform: uppercase; letter-spacing: 1px; }

    /* ACCORDION (LISTA DE TREINOS) */
    .accordion-item{ background:#111; border:1px solid #222; border-radius:12px; margin-bottom:10px; overflow:hidden; }
    .accordion-header{ width:100%; padding:20px; background:none; border:none; color:#fff; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size:1rem; font-weight:600; text-align: left; }
    .accordion-header:hover { background: #161616; }
    .accordion-content{ display:none; padding: 0 20px 20px 20px; color:#aaa; line-height:1.6; border-top: 1px solid #222; padding-top: 15px;}

    /* BOTÃO */
    .btn{ display:inline-block; margin-top:15px; padding:10px 20px; background:#fff; color:#000; border-radius:8px; font-weight:bold; cursor:pointer; border:none; transition:0.2s; }
    .btn:hover{ background:#ddd; }

    /* =========================
   RESPONSIVO
========================= */

@media(max-width:700px){

    .header{
        height:70px;
        padding:0 20px;
    }

    .logo{
        font-size:1.3rem;
    }

    .menu{
        gap:15px;
    }

    .menu a{
        font-size:0.95rem;
    }

    .container{
        padding:100px 15px 30px;
    }

    .plan-header{
        padding:20px;
    }

}


/* =========================
   CELULARES PEQUENOS
========================= */

@media(max-width:400px){

    .header{
        padding:0 15px;
    }

    .logo{
        font-size:1.1rem;
    }

    .menu{
        gap:10px;
    }

    .menu a{
        font-size:0.9rem;
    }

}
</style>
</head>
<body>

<header class="header">
    <div class="logo">
        IYFY ACADEMY
    </div>

    <nav>
        <ul class="menu">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

        </ul>
    </nav>
</header>

<main class="container">
    <h1 class="page-title">Plano 5K</h1>

    <div class="grid-top">
        <div class="card">
            <div class="badge">Status</div>
            <h2>Semana 4 de 16</h2>
            <p style="color:#888;">Foco: Velocidade e adaptação</p>
        </div>
        <div class="card highlight">
            <div class="badge">Próximo Treino</div>
            <h2>10x200m</h2>
            <button class="btn">Iniciar Treino</button>
        </div>
    </div>

    <div class="accordion">
        <!-- Exemplo de item -->
        <div class="accordion-item">
            <button class="accordion-header">
                <span>SEG • 10x200m (Tiro)</span>
                <span>+</span>
            </button>
            <div class="accordion-content">
                <p><strong>Aquecimento:</strong> 10 min trote leve.</p>
                <p><strong>Treino:</strong> 10 x 200m forte com 1min de descanso.</p>
            </div>
        </div>
        <!-- Repita para outros dias -->
    </div>
</main>

<script>
    document.querySelectorAll(".accordion-header").forEach(item => {
        item.addEventListener("click", () => {
            const content = item.nextElementSibling;
            const isOpen = content.style.display === "block";
            content.style.display = isOpen ? "none" : "block";
            item.querySelector("span:last-child").innerText = isOpen ? "+" : "−";
        });
    });
</script>
</body>
</html>
